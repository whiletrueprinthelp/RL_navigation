<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aim Agent Dashboard</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <!-- Top-level navigation between run dashboard and exact prompt payload view. -->
    <header class="topbar">
      <div class="tab-row" role="tablist" aria-label="Dashboard views">
        <button id="homeTabBtn" class="tab-btn active" role="tab" aria-selected="true">Home</button>
        <button id="promptTabBtn" class="tab-btn" role="tab" aria-selected="false">Prompt Message</button>
      </div>
      <span id="statusBadge" class="status idle">Idle</span>
    </header>

    <!-- Home: operator-focused runtime controls, logs, and live video feed. -->
    <main id="homeView" class="app-shell tab-view active" role="tabpanel">
      <section class="panel panel-left">
        <header class="panel-header">
          <h1>LLM Messages</h1>
        </header>
        <div id="logPane" class="log-pane" aria-live="polite"></div>
      </section>

      <section class="panel panel-right">
        <div class="feed-card">
          <div class="feed-header">
            <h2>Robot Feed</h2>
            <span id="feedMeta">Waiting for frame...</span>
          </div>
          <div class="feed-viewport">
            <img id="feedImage" alt="Robot camera feed" />
            <div id="feedFallback" class="feed-fallback">No frame yet</div>
          </div>
        </div>

        <div class="controls-card">
          <button id="startShootBtn" class="btn primary">Start Shoot</button>
          <button id="startTrackBtn" class="btn primary">Start Track</button>
          <button id="objectMovedBtn" class="btn secondary" disabled style="display: none;">Object Moved</button>
          <button id="stopBtn" class="btn danger" style="display: none;">Stop Agent</button>
        </div>
      </section>
    </main>

    <!-- Prompt Message: exact traced request payload sent to the LLM per call. -->
    <main id="promptView" class="prompt-view tab-view" role="tabpanel" aria-hidden="true">
      <section class="panel prompt-full-panel">
        <div class="prompt-header">
          <h2>Exact Prompt Sent to LLM</h2>
          <span id="promptMeta">Waiting for run...</span>
        </div>
        <pre id="promptPane" class="prompt-pane">No run prompt available yet.</pre>
      </section>
    </main>

    <script src="/socket.io/socket.io.js"></script>
    <script src="/app.js" defer></script>
  </body>
</html>
